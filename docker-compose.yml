services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: ["python", "-m", "mnema.api.main"]
    env_file: .env
    environment:
      # peremennaya iz .env dolzhna peremenyat' put' (pri pereezd na Postgres);
      # ranshe zhar-kod v `environment:` perebival env_file — silentnaya lovushka
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/db.sqlite}
      - ARCHIVE_DIR=/data/archive
      - TZ=Europe/Moscow
      - APP_TZ=Europe/Moscow
      - EXPORT_DIR=${EXPORT_DIR:-}
      # vygruzka: obrezka tishiny po krayam kopii sharomy (0 - vykluchit')
      - EXPORT_TRIM_SILENCE=${EXPORT_TRIM_SILENCE:-1}
      - EXPORT_TRIM_PAD_S=${EXPORT_TRIM_PAD_S:-0.5}
      - EXPORT_TRIM_NOISE_DB=${EXPORT_TRIM_NOISE_DB:--30}
      - EXPORT_TRIM_MIN_S=${EXPORT_TRIM_MIN_S:-0.5}
    volumes:
      - data:/data
      - ./templates:/app/templates:ro
      # Samba-export: bind-mount hostovogo CIFS-maunta (/mnt/mnema-export) v
      # konteyner. Pustaya EXPORT_HOST_DIR (peremennaya ne zadana) ->
      # neaktivnyy katalog v /dev/null-export-deactivated (ne sudshchestvuet,
      # togda export_configured()=False i vygruzka — no-op). Nastroyka maunta:
      # scripts/smb-mount.sh.
      - "${EXPORT_HOST_DIR:-/dev/null-export-deactivated}:/export"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # /est' health-endpoint: container-start != API-gotov; ran'she deploy
      # obyhal'sya `sleep 8 + curl` kak vneshtney kostyl'
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        WITH_ASR: "1"
    command: ["python", "-m", "mnema.worker.main"]
    env_file: .env
    environment:
      # worker: tot zhe put' BDD cherez env (bez zharkoda, pereezd na Postgres
      # = odna stroka v .env)
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/db.sqlite}
      - ARCHIVE_DIR=/data/archive
      - TZ=Europe/Moscow
      - APP_TZ=Europe/Moscow
      - EXPORT_DIR=${EXPORT_DIR:-}
      # vygruzka: obrezka tishiny po krayam kopii sharomy (0 - vykluchit')
      - EXPORT_TRIM_SILENCE=${EXPORT_TRIM_SILENCE:-1}
      - EXPORT_TRIM_PAD_S=${EXPORT_TRIM_PAD_S:-0.5}
      - EXPORT_TRIM_NOISE_DB=${EXPORT_TRIM_NOISE_DB:--30}
      - EXPORT_TRIM_MIN_S=${EXPORT_TRIM_MIN_S:-0.5}
      # razdelenie vstrech (etap split): kill-switch 0, porogi, okno detekcii
      - SPLIT_MEETINGS=${SPLIT_MEETINGS:-1}
      - SPLIT_MIN_MINUTES=${SPLIT_MIN_MINUTES:-20}
      - SPLIT_MIN_CONFIDENCE=${SPLIT_MIN_CONFIDENCE:-0.7}
      - SPLIT_WINDOW_CHARS=${SPLIT_WINDOW_CHARS:-40000}
      # analiz LLM: okno stenogrammy na 1 zaprosov (context 131k) i ozhidanie ocheredi
      - LLM_WINDOW_CHARS=${LLM_WINDOW_CHARS:-60000}
      - LLM_LOCK_WAIT_TIMEOUT_S=${LLM_LOCK_WAIT_TIMEOUT_S:-7200}
      - LLM_REQUEST_TIMEOUT_S=${LLM_REQUEST_TIMEOUT_S:-900}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16000}
    volumes:
      - data:/data
      - hf-cache:/root/.cache/huggingface
      - "${EXPORT_HOST_DIR:-/dev/null-export-deactivated}:/export"
    depends_on:
      redis:
        condition: service_healthy
    # RQ-horse ne imeet HTTP-endpoint. Osnovnoy priznak zhizni — molotok,
    # kotoryy worker-potok trogaet kazhdy 30 s na obshchem /data
    # (mnema/worker/main.py): esli glavnyy protsess zyblk — molotok molchit.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p=os.environ.get('WORKER_HEARTBEAT_FILE','/data/worker.heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<90 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    restart: unless-stopped

  web-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.webbot
    env_file: .env
    environment:
      - ZOOM_PROFILE_DIR=/data/zoom-profile
      - DATA_DIR=/data
      - HEADFUL=1   # Chromium pod Xvfb, noVNC dlya vruchnuyu prokhoda reCAPTCHA (§12)
      - TZ=Europe/Moscow
    volumes:
      - data:/data
      - ./templates:/app/templates:ro
    ports:
      # noVNC: 8080 = ekran nastroyki (setup), 8080+slot = ekrany vstrech;
      # vnutrennie 6080+slot (VNC_MAX_SLOTS po umolch. 20 -> diapazon 8080-8100).
      # §HT: ekrany bez autentifikatsii API — pri nedoverennoy seti uzhite
      # VNC_PUBLISH_BIND=127.0.0.1: (togda dostup cherno reverse-proxy/ssh-tunnel)
      # i/ili VNC_PASSWORD dlya samogo VNC-protokola.
      - "${VNC_PUBLISH_BIND:-}8080-8100:6080-6100"
    depends_on:
      redis:
        condition: service_healthy
    # drain pri SIGTERM daet rekorderyam 25 s na finalize (index.js installShutdown);
    # docker grace po defaultu 10 s — bez etogo konteyner bilsya SIGKILL
    # poseredine finalize, zapis' dozhidayetsya tol'ko salvage posle perepuska
    stop_grace_period: 30s
    # molotok zhivosti (web-bot/src/index.js startHeartbeatFile) kazhdy 15 s;
    # esli event loop zyblitsa — molotok molchit (node est' v obraze, python net)
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const p=process.env.WEBBOT_HEARTBEAT_FILE||(process.env.DATA_DIR||'/data')+'/web-bot.heartbeat';try{process.exit(Date.now()-fs.statSync(p).mtimeMs<90000?0:1)}catch{process.exit(1)}"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  redis:
    # teg NE pinim na minor: pereklyuchenie image (redis:7 -> redis:7.4)
    # pereproizvedyet konteyner i sbrosit ochered' launch/LLM-gate (AGENTS.md).
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

volumes:
  data:
  redis-data:
  hf-cache:
